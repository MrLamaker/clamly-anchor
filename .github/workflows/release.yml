name: Release

# Changesets on main open (or update) a "Release packages" pull request that
# bumps versions and changelogs. Merging that pull request publishes the new
# versions to npm with provenance, then tags them and creates GitHub releases.
on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  id-token: write # npm provenance

jobs:
  release:
    name: Version or publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12.4.1
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Create release pull request or publish to npm
        uses: changesets/action@v2
        # The GitHub token comes from the action's github-token input, which defaults to this workflow's token.
        with:
          version-script: pnpm changeset version
          # See the "release" script in package.json: it publishes with provenance and tags what it published.
          publish-script: pnpm release
          pr-title: Release packages
          commit-message: Release packages
        env:
          # npm reads the token through the .npmrc that actions/setup-node wrote (registry-url above).
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
